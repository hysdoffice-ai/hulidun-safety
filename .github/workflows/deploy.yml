name: Deploy RFQ optimized static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply RFQ conversion and UX patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d | git apply -

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate product WebP images
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          find public/images/products -type f \( -name '*.jpg' -o -name '*.png' \) -print0 | while IFS= read -r -d '' image; do
            cwebp -quiet -q 82 "$image" -o "${image%.*}.webp"
          done

      - name: Build static export
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
