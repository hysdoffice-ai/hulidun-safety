name: Fetch Chinese ASR Runtime

on:
  pull_request:
    branches: [ main ]

jobs:
  fetch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Download Python 3.13 sherpa-onnx wheel
        run: |
          set -eux
          mkdir -p chinese-asr-py313
          cd chinese-asr-py313
          curl -L --fail --retry 3 -O https://huggingface.co/csukuangfj2/sherpa-onnx-wheels/resolve/main/cpu/1.13.4/sherpa_onnx-1.13.4-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
          ls -lh
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: chinese-asr-py313
          path: chinese-asr-py313
          compression-level: 0
          retention-days: 1
