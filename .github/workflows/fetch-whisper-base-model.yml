name: Fetch Whisper Base Model

on:
  pull_request:
    branches: [ main ]

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download public multilingual Whisper model
        run: |
          curl -L --fail --retry 3 -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          ls -lh ggml-base-q5_1.bin
          sha256sum ggml-base-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1-model
          path: ggml-base-q5_1.bin
          retention-days: 1
